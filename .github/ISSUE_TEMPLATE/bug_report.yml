name: Bug report
description: Something in the desktop client is broken or behaves oddly.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        For problems with the game itself (elections, economy, turns) rather than
        the desktop app, use [Egg3901/AHDGame](https://github.com/Egg3901/AHDGame/issues).

        Do not report a security vulnerability here — see [SECURITY.md](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the client
        2. Navigate to …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Client version
      description: Help > About, or the installer filename.
      placeholder: '1.3.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: >
        Any error dialog text. If the window renders, View > Toggle Developer
        Tools and paste anything red from the Console.
      render: text
    validations:
      required: false
